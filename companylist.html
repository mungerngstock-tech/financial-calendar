<style>

  .container { max-width: 900px; margin: 0 auto; }
  .header { margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  h1 { font-size: 1.5rem; background: linear-gradient(135deg, #4f8cff, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: var(--text2); font-size: .85rem; }
  .back-link { color: var(--accent); font-size: .82rem; text-decoration: none; border: 1px solid var(--border); padding: 4px 12px; border-radius: 14px; }
  .back-link:hover { border-color: var(--accent); }

  .search-bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; }
  .search-input {
    width: 100%; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .9rem;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .stats { font-size: .78rem; color: var(--text2); margin: 12px 0; }

  .company-list { display: flex; flex-direction: column; gap: 12px; }
  .company-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; transition: all .2s;
  }
  .company-card:hover { border-color: var(--accent); }
  .company-header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer;
    user-select: none;
  }
  .ticker-badge {
    font-weight: 700; color: var(--accent); font-size: .95rem; min-width: 70px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .company-name { font-weight: 600; font-size: 1rem; flex: 1; }
  .company-arrow { color: var(--text2); transition: transform .2s; font-size: .8rem; }
  .company-card.open .company-arrow { transform: rotate(90deg); }
  .company-body { display: none; padding: 14px 16px 16px; border-top: 1px solid var(--border); }
  .company-card.open .company-body { display: block; }
  .comp-section { margin-bottom: 12px; }
  .comp-section h3 {
    font-size: .78rem; color: var(--accent); letter-spacing: 1px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .comp-section h3::before { content: ''; width: 4px; height: 12px; border-radius: 2px; background: var(--accent); }
  .comp-section p, .comp-section div { font-size: .88rem; color: var(--text); }
  .note-line { font-size: .75rem; color: var(--text2); margin-top: 2px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
  .update-time { font-size: .75rem; color: var(--text2); margin-top: 30px; text-align: center; }

  @media (max-width: 600px) {

/* ---- Parsing helpers ---- */
function parseMarkdown(mdText) {
  const lines = mdText.split('\n');
  let currentDate = '';
  let inTable = false;
  const seen = new Map();

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const h3 = line.match(/^###\s+(\d{4}-\d{2}-\d{2})（(.+?)）/);
    if (h3) { currentDate = h3[1]; inTable = false; continue; }
    if (line.startsWith('##') || line.startsWith('# ')) { inTable = false; currentDate = ''; continue; }
    if (line.startsWith('|') && line.includes('時間') && line.includes('事件')) { inTable = true; continue; }
    if (inTable && line.startsWith('|---')) { continue; }
    if (inTable && line.startsWith('|') && currentDate) {
      const parts = line.split('|');
      const cols = parts.slice(1, parts.length - 1).map(c => c.trim());
      if (cols.length >= 6) {
        const raw = cols[4] || '';
        raw.split(/[,，]\s*/).forEach(t => {
          const tk = t.trim();
          if (tk && tk !== '全市場') {
            if (!seen.has(tk)) seen.set(tk, []);
            seen.get(tk).push({ date: currentDate, name: cols[1].replace(/\*\*/g, '') });
          }
        });
      }
    }
    if (inTable && line === '') inTable = false;
  }
  return seen;
}

/* ---- Render ---- */
function render(filterText) {
  const list = document.getElementById('companyList');
  const stats = document.getElementById('stats');
  const q = (filterText || '').trim().toLowerCase();
  const entries = Array.from(allTickers.entries());

  const matched = entries.filter(([tk, info]) => {
    if (!q) return true;
    const comp = COMPANIES[tk];
    const name = comp ? comp.name : '';
    return tk.toLowerCase().includes(q) || name.toLowerCase().includes(q);
  });

  stats.textContent = `共 ${entries.length} 間公司（events.md 出現的標的）`;

  if (matched.length === 0) {
    list.innerHTML = `<div class="empty">找不到符合「${filterText}」的公司</div>`;
    return;
  }

  list.innerHTML = matched.map(([tk, info]) => {
    const comp = COMPANIES[tk];
    if (!comp) {
      return `
        <div class="company-card">
          <div class="company-header">
            <span class="ticker-badge">${tk}</span>
            <span class="company-name">${tk}（未收錄介紹）</span>
            <span class="company-arrow">▶</span>
          </div>
        </div>`;
    }
    return `
      <div class="company-card">
        <div class="company-header">
          <span class="ticker-badge">${tk}</span>
          <span class="company-name">${comp.name}</span>
          <span class="company-arrow">▶</span>
        </div>
        <div class="company-body">
          <div class="comp-section">
            <h3>為何重要</h3>
            <p>${comp.why}</p>
            <div class="note-line">📌 ${comp.note}｜出現 ${info.length} 次（${info[info.length-1].date} 後）</div>
          </div>
          <div class="comp-section">
            <h3>競爭對手</h3>
            <p>${comp.rivals}</p>
          </div>
          <div class="comp-section">
            <h3>上下游</h3>
            <p>${comp.chain}</p>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ---- Boot ---- */
let allTickers = new Map();

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('input', e => {
    render(e.target.value);
  });
  document.getElementById('companyList').addEventListener('click', e => {
    const card = e.target.closest('.company-card');
    if (card) card.classList.toggle('open');
  });

  fetch(DATA_URL)
    .then(res => { if (!res.ok) throw new Error('Network error: ' + res.status); return res.text(); })
    .then(text => {
      allTickers = parseMarkdown(text);
      document.getElementById('updateTime').textContent =
        `資料來源：events.md（${new Date().toISOString().slice(0, 16).replace('T', ' ')} 讀取）`;
      render('');
    })
    .catch(err => {
      document.getElementById('companyList').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div>無法載入 events.md</div>
          <div style="font-size:.8rem;margin-top:8px">${err.message}</div>
        </div>`;
    });
});
