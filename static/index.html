<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財經行事曆</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --text: #e0e0e0;
    --text2: #a0a0b8;
    --accent: #4f8cff;
    --imp5: #ff4757;
    --imp4: #ff6b81;
    --imp3: #ffa502;
    --imp2: #2ed573;
    --border: #2a2a4a;
    --shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height:1.6; padding: 20px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.6rem; background: linear-gradient(135deg, #4f8cff, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: var(--text2); font-size: .85rem; margin-bottom: 4px; }
  .header { margin-bottom: 24px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .today-display { font-size: .85rem; color: var(--text2); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 16px; border-radius: 16px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    font-size: .82rem; transition: all .2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .day-group { margin-bottom: 24px; }
  .day-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .day-header.today { border-bottom-color: var(--accent); }
  .day-date { font-size: 1.05rem; font-weight: 600; }
  .day-weekday { font-size: .8rem; color: var(--text2); }
  .today-badge {
    background: var(--accent); color: #fff; font-size: .65rem;
    padding: 2px 10px; border-radius: 10px; font-weight: 500;
  }
  .event-card {
    background: var(--card); border-radius: 8px; padding: 12px 16px;
    margin-bottom: 8px; border-left: 3px solid var(--border);
    display: flex; gap: 12px; align-items: flex-start; transition: all .2s;
  }
  .event-card:hover { background: var(--card2); }
  .event-card.imp-5 { border-left-color: var(--imp5); }
  .event-card.imp-4 { border-left-color: var(--imp4); }
  .event-card.imp-3 { border-left-color: var(--imp3); }
  .event-card.imp-2 { border-left-color: var(--imp2); }
  .event-body { flex: 1; min-width: 0; }
  .event-name { font-weight: 600; font-size: .92rem; }
  .event-meta { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .event-meta span { font-size: .78rem; color: var(--text2); }
  .event-time { color: var(--accent) !important; font-weight: 500; }
  .event-note { font-size: .8rem; color: var(--text2); margin-top: 4px; }
  .ticker {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    background: rgba(79, 140, 255, .15); color: var(--accent);
    font-size: .72rem; font-weight: 500; margin-right: 4px;
  }
  .importance { display: flex; gap: 2px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .update-time { font-size: .75rem; color: var(--text2); margin-top: 30px; text-align: center; }
  .past-section { margin-top: 32px; opacity: .4; }
  .past-toggle {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: .82rem; padding: 8px; width: 100%; text-align: center;
  }
  .past-toggle:hover { color: var(--text); }
  .past-content { display: none; }
  .past-content.show { display: block; }
  @media (max-width: 600px) {
    body { padding: 12px; }
    .event-card { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <h1>📅 財經行事曆</h1>
      <div class="today-display" id="todayDisplay"></div>
    </div>
    <p class="subtitle">直接讀取 events.md，編輯 MD 即更新</p>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="5">🔥 最重要</button>
    <button class="filter-btn" data-filter="4">⭐ 重要</button>
    <button class="filter-btn" data-filter="財報">📊 財報</button>
    <button class="filter-btn" data-filter="總經">🌍 總經</button>
    <button class="filter-btn" data-filter="today">📌 今天</button>
  </div>

  <div id="eventList"></div>
  <div class="update-time" id="updateTime"></div>
</div>

<script>
const DATA_URL = '../events.md';

const IMP_STARS = { 5: '🔥', 4: '⭐', 3: '📌', 2: '💡' };
const IMP_CLASS = { 5: 'imp-5', 4: 'imp-4', 3: 'imp-3', 2: 'imp-2' };
const DAY_CN = ['日', '一', '二', '三', '四', '五', '六'];

let allEvents = [];
let currentFilter = 'all';
let lastUpdated = '';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isToday(d) { return d === todayStr(); }

/* ---- Markdown Parser ---- */
function parseMarkdown(mdText) {
  const events = [];
  const lines = mdText.split('\n');
  let currentDate = '';
  let currentWeekday = '';
  let inTable = false;
  let colCount = 0;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    // H3 heading: ### 2026-07-29（三）
    const h3Match = line.match(/^###\s+(\d{4}-\d{2}-\d{2})（(.+?)）/);
    if (h3Match) {
      currentDate = h3Match[1];
      currentWeekday = h3Match[2];
      inTable = false;
      continue;
    }

    // Table header row: | 日期 | 時間 | ...
    if (line.startsWith('|') && line.includes('日期') && line.includes('時間')) {
      inTable = true;
      colCount = line.split('|').filter(c => c.trim()).length;
      continue;
    }

    // Separator row: |---|---|...
    if (inTable && line.startsWith('|---')) {
      continue;
    }

    // Data row
    if (inTable && line.startsWith('|') && currentDate) {
      const cols = line.split('|').map(c => c.trim()).filter(c => c !== '');
      if (cols.length >= 6) {
        // cols: [日期(含星期), 時間, 事件, 重要性, 分類, 相關標的, 備註]
        // Extract date from first column (e.g., "2026-07-29（三）")
        const dateFromCol = cols[0].match(/^(\d{4}-\d{2}-\d{2})/);
        const evDate = dateFromCol ? dateFromCol[1] : currentDate;

        const timeStr = cols[1] || '';
        // Strip markdown bold from event name
        const evName = (cols[2] || '').replace(/\*\*/g, '');
        // Count stars for importance
        const impStr = cols[3] || '';
        const impCount = (impStr.match(/⭐/g) || []).length || 3;
        const category = cols[4] || '';
        // Parse tickers: split by comma, or single value
        const tickerRaw = cols[5] || '';
        const tickers = tickerRaw ? tickerRaw.split(/[,，]\s*/) : [];
        const note = cols[6] || '';

        events.push({
          date: evDate,
          day: currentWeekday,
          time: timeStr,
          name: evName,
          importance: impCount,
          category: category,
          tickers: tickers,
          note: note
        });
      }
    }

    // End of table (blank line after data rows)
    if (inTable && line === '') {
      inTable = false;
    }

    // Section heading like ## or # — end current table context
    if (line.startsWith('##') || line.startsWith('# ')) {
      inTable = false;
      currentDate = '';
    }
  }

  return events;
}

/* ---- Filter & Render (unchanged logic) ---- */
function filterEvents(events, filter) {
  const today = todayStr();
  if (filter === 'today') {
    return events.filter(e => e.date === today);
  }
  const upcoming = events.filter(e => e.date >= today);
  if (filter === 'all') return upcoming;
  if (filter === '5') return upcoming.filter(e => e.importance === 5);
  if (filter === '4') return upcoming.filter(e => e.importance >= 4);
  if (filter === '財報') return upcoming.filter(e => e.category === '財報');
  if (filter === '總經') return upcoming.filter(e => e.category === '總經');
  return upcoming;
}

function groupByDate(events) {
  const groups = {};
  events.forEach(e => {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });
  return Object.keys(groups).sort().map(date => ({
    date,
    weekday: DAY_CN[new Date(date + 'T00:00:00').getDay()],
    events: groups[date]
  }));
}

function render(filter) {
  const filtered = filterEvents(allEvents, filter);
  const grouped = groupByDate(filtered);
  const container = document.getElementById('eventList');

  if (grouped.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎉</div>
        <div>近期無重大事件</div>
        <div style="font-size:.8rem;margin-top:8px">或切換篩選條件查看</div>
      </div>`;
    return;
  }

  container.innerHTML = grouped.map(g => `
    <div class="day-group">
      <div class="day-header ${isToday(g.date) ? 'today' : ''}">
        <span class="day-date">${g.date}</span>
        <span class="day-weekday">星期${g.weekday}</span>
        ${isToday(g.date) ? '<span class="today-badge">今天</span>' : ''}
      </div>
      ${g.events.map(e => `
        <div class="event-card ${IMP_CLASS[e.importance] || ''}">
          <div class="imp-indicator">${IMP_STARS[e.importance] || ''}</div>
          <div class="event-body">
            <div class="event-name">${e.name}</div>
            <div class="event-meta">
              <span class="event-time">🕐 ${e.time}</span>
              <span>${e.category}</span>
              ${e.tickers.map(t => `<span class="ticker">${t}</span>`).join('')}
            </div>
            ${e.note ? `<div class="event-note">${e.note}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  render(filter);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('todayDisplay').textContent =
    `今天是 ${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日`;

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  fetch(DATA_URL)
    .then(res => {
      if (!res.ok) throw new Error('Network error: ' + res.status);
      return res.text();
    })
    .then(text => {
      allEvents = parseMarkdown(text);
      lastUpdated = new Date().toISOString().slice(0, 16).replace('T', ' ');
      document.getElementById('updateTime').textContent =
        `資料更新：${lastUpdated}（自動解析 events.md）`;
      render('all');
    })
    .catch(err => {
      document.getElementById('eventList').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div>無法載入行事曆資料</div>
          <div style="font-size:.8rem;margin-top:8px">${err.message}</div>
        </div>`;
    });
});
</script>
</body>
</html>
